<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ead095">
  <title>Gruhapravesham Invitation</title>

  <style>
    :root {
      --cream: #fff7e8;
      --gold: #b9893f;
      --gold-dark: #8f641f;
      --maroon: #7f2727;
      --maroon-dark: #641b1b;
      --shadow: 0 20px 55px rgba(83, 52, 12, .22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.6), transparent 34%),
        linear-gradient(180deg, #f8ecd2 0%, #e9ca8c 100%);
      -webkit-tap-highlight-color: transparent;
    }

    .invitation-stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .invitation {
      position: relative;
      width: min(96vw, 760px);
      aspect-ratio: 2 / 3;
      overflow: hidden;
      border-radius: 12px;
      background: #e7c57f;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .invitation-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* ---------------------------------------------------------
       LOCATION BUTTON
       Bottom-right, away from the invitation text.
       Fine tune only right/bottom if required for your image.
       --------------------------------------------------------- */
    .map-cta {
      position: absolute;
      right: 5.2%;
      bottom: 5.4%;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 6px 12px 6px 7px;
      color: var(--maroon-dark);
      text-decoration: none;
      border: 1px solid rgba(143, 100, 31, .72);
      border-radius: 999px;
      background: rgba(255, 247, 232, .90);
      box-shadow:
        0 7px 22px rgba(78, 43, 11, .20),
        inset 0 1px 0 rgba(255,255,255,.85);
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);
      transition:
        transform .22s ease,
        box-shadow .22s ease,
        background .22s ease,
        border-color .22s ease;
      touch-action: manipulation;
    }

    .map-cta:hover,
    .map-cta:focus-visible {
      transform: translateY(-2px);
      background: rgba(255, 250, 241, .98);
      border-color: var(--gold-dark);
      box-shadow:
        0 10px 26px rgba(78, 43, 11, .26),
        inset 0 1px 0 rgba(255,255,255,.95);
    }

    .map-cta:active {
      transform: translateY(0) scale(.98);
    }

    .map-cta:focus-visible {
      outline: 2px solid rgba(127, 39, 39, .72);
      outline-offset: 3px;
    }

    .map-icon {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff9ed;
      background: linear-gradient(180deg, #973737 0%, #731f1f 100%);
      box-shadow: 0 4px 10px rgba(95, 24, 24, .22);
    }

    .map-icon svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .map-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      line-height: 1.05;
      white-space: nowrap;
    }

    .map-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .025em;
    }

    .map-subtitle {
      margin-top: 3px;
      font-family: Arial, sans-serif;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .04em;
      color: #9b7042;
    }

    /* ---------------------------------------------------------
       MUSIC BUTTON
       Symbol only. The slash appears when music is muted/off.
       --------------------------------------------------------- */
    .music-button {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 20;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(143, 100, 31, .72);
      border-radius: 50%;
      color: var(--maroon);
      background: rgba(255, 247, 232, .92);
      box-shadow: 0 8px 24px rgba(65, 38, 9, .20);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .music-button:hover,
    .music-button:focus-visible {
      transform: translateY(-2px);
      background: #fffaf1;
      box-shadow: 0 11px 28px rgba(65, 38, 9, .26);
    }

    .music-button:active {
      transform: scale(.96);
    }

    .music-button:focus-visible {
      outline: 2px solid rgba(127, 39, 39, .72);
      outline-offset: 3px;
    }

    .music-button svg {
      width: 23px;
      height: 23px;
      display: block;
    }

    .music-button .music-slash {
      opacity: 0;
      transition: opacity .18s ease;
    }

    .music-button[aria-pressed="false"] .music-slash {
      opacity: 1;
    }

    /* Gentle attention only until audio has successfully started. */
    .music-button.needs-gesture {
      animation: musicHint 2.2s ease-in-out infinite;
    }

    @keyframes musicHint {
      0%, 100% { box-shadow: 0 8px 24px rgba(65, 38, 9, .20), 0 0 0 0 rgba(185,137,63,0); }
      50% { box-shadow: 0 8px 24px rgba(65, 38, 9, .20), 0 0 0 8px rgba(185,137,63,.15); }
    }

    @media (max-width: 640px) {
      body {
        padding: 8px;
      }

      .invitation {
        width: 100%;
        border-radius: 8px;
      }

      .map-cta {
        right: 4.2%;
        bottom: 4.7%;
        min-height: 38px;
        gap: 7px;
        padding: 5px 10px 5px 6px;
      }

      .map-icon {
        width: 27px;
        height: 27px;
        flex-basis: 27px;
      }

      .map-icon svg {
        width: 14px;
        height: 14px;
      }

      .map-title {
        font-size: 10px;
      }

      .map-subtitle {
        font-size: 7px;
        margin-top: 2px;
      }

      .music-button {
        width: 44px;
        height: 44px;
        right: max(11px, env(safe-area-inset-right));
        bottom: max(11px, env(safe-area-inset-bottom));
      }

      .music-button svg {
        width: 21px;
        height: 21px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="invitation-stage">
    <section class="invitation" aria-label="Gruhapravesham invitation">
      <!-- Keep invitation.png in the same folder as this HTML file. -->
      <img
        class="invitation-image"
        src="invitation.jpeg"
        alt="Gruhapravesham house warming invitation"
        draggable="false"
      >

      <!-- Interactive Google Maps location -->
      <a
        class="map-cta"
        href="https://www.google.com/maps/search/Jayapradam%20Apartment/@17.48279199,78.37930255,17z?hl=en"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View venue location on Google Maps"
      >
        <span class="map-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 22s7-6.08 7-12a7 7 0 1 0-14 0c0 5.92 7 12 7 12Z"
              fill="currentColor"
            />
            <circle cx="12" cy="10" r="2.65" fill="#7b2424" />
          </svg>
        </span>

        <span class="map-copy">
          <span class="map-title">View Location</span>
          <span class="map-subtitle">Google Maps ↗</span>
        </span>
      </a>
    </section>
  </main>

  <!-- Keep music.mp3 in the same folder as this HTML file. -->
  <audio id="bgMusic" preload="auto" loop playsinline>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- Music icon only -->
  <button
    class="music-button needs-gesture"
    id="musicButton"
    type="button"
    aria-label="Play background music"
    aria-pressed="false"
    title="Background music"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M9 18V6.8L19 5v10.1"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <ellipse cx="6.3" cy="18.2" rx="3.3" ry="2.5" fill="currentColor" />
      <ellipse cx="16.3" cy="15.4" rx="3.3" ry="2.5" fill="currentColor" />
      <path
        d="M9 9.4 19 7.6"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
      />

      <!-- Visible only while music is off -->
      <path
        class="music-slash"
        d="M4 4 20 20"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
      />
    </svg>
  </button>

  <script>
    (() => {
      const audio = document.getElementById('bgMusic');
      const musicButton = document.getElementById('musicButton');

      let musicStarted = false;
      let userMuted = false;
      let starting = false;

      // Set a comfortable initial background level.
      audio.volume = 0.55;

      function updateMusicUI() {
        const isPlaying = !audio.paused && !audio.ended;

        musicButton.setAttribute('aria-pressed', isPlaying ? 'true' : 'false');
        musicButton.setAttribute(
          'aria-label',
          isPlaying ? 'Pause background music' : 'Play background music'
        );

        if (musicStarted) {
          musicButton.classList.remove('needs-gesture');
        }
      }

      async function startMusicFromGesture() {
        if (userMuted || starting || (!audio.paused && !audio.ended)) return;

        starting = true;

        try {
          await audio.play();
          musicStarted = true;
          userMuted = false;
        } catch (error) {
          // Browsers may still block audio in some environments.
          // Keep the music icon available for a direct tap.
        } finally {
          starting = false;
          updateMusicUI();
        }
      }

      async function toggleMusic(event) {
        event.preventDefault();
        event.stopPropagation();

        if (!audio.paused) {
          audio.pause();
          userMuted = true;
          updateMusicUI();
          return;
        }

        userMuted = false;
        await startMusicFromGesture();
      }

      musicButton.addEventListener('click', toggleMusic);

      audio.addEventListener('play', () => {
        musicStarted = true;
        userMuted = false;
        updateMusicUI();
      });

      audio.addEventListener('pause', updateMusicUI);

      /*
        Modern browsers generally require one real user gesture before
        audible media can play. Listening at pointer/touch start means
        a tap OR the beginning of a swipe can start the invitation music.
      */
      const firstGesture = (event) => {
        // If the first action is on the music button, let its own handler
        // control playback so it does not start and immediately pause.
        if (event.target.closest && event.target.closest('#musicButton')) {
          return;
        }

        startMusicFromGesture();
      };

      document.addEventListener('pointerdown', firstGesture, {
        passive: true,
        capture: true
      });

      // Fallback for older touch browsers that do not fully support Pointer Events.
      document.addEventListener('touchstart', firstGesture, {
        passive: true,
        capture: true
      });

      document.addEventListener('keydown', firstGesture, {
        capture: true
      });

      updateMusicUI();
    })();
  </script>
</body>
</html>
