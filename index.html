<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7e8d4">
<title>Sadanala Family Gruhapravesham Invitation</title>

<!-- Purple rounded-square favicon with white U -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23b423e8'/%3E%3Cstop offset='1' stop-color='%237c20d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial,sans-serif' font-size='38' font-weight='700' fill='white'%3EU%3C/text%3E%3C/svg%3E">
<link rel="shortcut icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%239127dc'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial,sans-serif' font-size='38' font-weight='700' fill='white'%3EU%3C/text%3E%3C/svg%3E">

<style>
:root{
  --maroon:#7c2525;
  --maroon-dark:#5f1919;
  --gold:#b98a3e;
  --cream:#fff8ec;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  overscroll-behavior:none;
  background:#ead1ad;
}

body{
  font-family:Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

/* =========================================================
   FULL VIEWPORT APP
   ========================================================= */
.app{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#ead1ad;
}

/* =========================================================
   ORIGINAL INVITATION

   IMPORTANT:
   The invitation itself uses CONTAIN so the complete decorative
   border remains visible. A blurred copy fills the unused viewport
   area, so there are no plain top/bottom bars.
   ========================================================= */
.invitation-screen{
  position:absolute;
  inset:0;
  z-index:1;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#e7bf78;
  opacity:0;
  transform:scale(1.02);
  transition:
    opacity 1s ease,
    transform 1.3s cubic-bezier(.2,.72,.2,1);
}

.app.opened .invitation-screen{
  opacity:1;
  transform:scale(1);
}

.invitation-backdrop{
  position:absolute;
  inset:-32px;
  width:calc(100% + 64px);
  height:calc(100% + 64px);
  object-fit:cover;
  object-position:48% center;
  filter:blur(24px) saturate(.92) brightness(.93);
  transform:scale(1.08);
  opacity:.82;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

.invitation-screen::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:rgba(246,225,187,.12);
}

.invitation-poster{
  position:relative;
  z-index:2;

  /* Entire 2:3 invitation is always visible. */
  width:min(100vw, calc(100dvh * 2 / 3));
  aspect-ratio:2 / 3;
  max-height:100dvh;

  margin:0;
  padding:0;
  overflow:hidden;
}

.invitation-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  object-position:center center;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

/* =========================================================
   LOCATION BUTTON
   ========================================================= */
.map-cta{
  position:absolute;
  right:3.2%;
  bottom:3.0%;
  z-index:8;

  display:inline-flex;
  align-items:center;
  gap:10px;

  min-height:50px;
  padding:7px 16px 7px 7px;

  border:2px solid #e0b45e;
  border-radius:999px;

  color:#fffaf0;
  background:linear-gradient(135deg,#6f1b1b 0%,#9b3434 100%);
  text-decoration:none;

  box-shadow:
    0 10px 28px rgba(81,23,23,.34);

  overflow:hidden;

  opacity:0;
  transform:translateY(12px) scale(.96);

  transition:
    opacity .65s ease 1s,
    transform .65s ease 1s,
    filter .2s ease,
    box-shadow .2s ease;
}

/* Same moving shine used by the OPEN INVITATION button */
.map-cta::before{
  content:"";
  position:absolute;
  top:-35%;
  left:-30%;
  width:18%;
  height:170%;
  transform:skewX(-20deg);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,245,212,.32),
    transparent
  );
  pointer-events:none;
  opacity:0;
}

/* Fine inner gold highlight, matching the invitation style */
.map-cta::after{
  content:"";
  position:absolute;
  inset:3px;
  border:1px solid rgba(255,229,173,.22);
  border-radius:999px;
  pointer-events:none;
}

.app.opened .map-cta{
  opacity:1;
  transform:translateY(0) scale(1);
}

.app.opened .map-cta::before{
  opacity:1;
  animation:buttonShine 3.1s ease-in-out 1.25s infinite;
}

.map-cta:hover,
.map-cta:focus-visible{
  filter:brightness(1.08);
  transform:translateY(-2px) scale(1.02);
}

.map-cta:active{
  transform:scale(.98);
}

.map-cta:focus-visible{
  outline:3px solid #fff4d2;
  outline-offset:3px;
}

.map-pin{
  width:36px;
  height:36px;
  flex:0 0 36px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#fff5df;
  color:#812727;
  box-shadow:inset 0 0 0 1px rgba(185,138,62,.45);
}

.map-pin svg{
  width:19px;
  height:19px;
}

.map-copy{
  display:flex;
  flex-direction:column;
  line-height:1;
  white-space:nowrap;
}

.map-title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.025em;
}

.map-sub{
  margin-top:5px;
  font-size:8px;
  font-weight:700;
  letter-spacing:.10em;
  text-transform:uppercase;
  color:#f0d49c;
}

/* =========================================================
   MUSIC BUTTON
   ========================================================= */
.music-button{
  position:absolute;
  top:max(10px,env(safe-area-inset-top));
  right:max(10px,env(safe-area-inset-right));
  z-index:9;

  width:43px;
  height:43px;

  display:grid;
  place-items:center;

  border:1px solid rgba(148,103,42,.72);
  border-radius:50%;

  background:rgba(255,248,236,.95);
  color:var(--maroon);

  box-shadow:0 7px 21px rgba(70,39,12,.2);
  cursor:pointer;

  opacity:0;
  transform:translateY(-8px);

  transition:
    opacity .65s ease 1s,
    transform .65s ease 1s,
    background .2s ease;
}

.app.opened .music-button{
  opacity:1;
  transform:translateY(0);
}

.music-button:hover,
.music-button:focus-visible{
  background:#fffaf1;
}

.music-button:active{
  transform:scale(.95);
}

.music-button:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:3px;
}

.music-button svg{
  width:21px;
  height:21px;
}

.music-slash{
  opacity:0;
  transition:opacity .2s ease;
}

.music-button[aria-pressed="false"] .music-slash{
  opacity:1;
}

/* =========================================================
   OPENING BACKDROP FOR LAPTOP / LANDSCAPE
   ========================================================= */
.opening-backdrop{
  display:none;
  position:absolute;
  inset:-32px;
  width:calc(100% + 64px);
  height:calc(100% + 64px);
  object-fit:cover;
  object-position:center center;
  filter:blur(24px) saturate(.92) brightness(.95);
  transform:scale(1.08);
  opacity:.80;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

/* =========================================================
   OPENING SCREEN
   ========================================================= */
.opening-screen{
  position:absolute;
  inset:0;
  z-index:50;
  width:100%;
  height:100%;
  overflow:hidden;

  opacity:1;
  visibility:visible;
  filter:blur(0);
  transform:scale(1);

  transition:
    opacity .9s ease,
    filter .9s ease,
    transform 1.1s cubic-bezier(.2,.72,.2,1),
    visibility .9s ease;
}

.opening-screen.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  filter:blur(3px);
  transform:scale(1.025);
}

.opening-poster{
  position:absolute;
  inset:0;
  z-index:2;
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}

.opening-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center center;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

/* =========================================================
   OPEN INVITATION HOTSPOT

   The JS below keeps this hotspot aligned to the button
   printed inside opening.png even when object-fit: cover
   crops the left/right or top/bottom of the source image.
   ========================================================= */
.open-hotspot{
  position:absolute;
  z-index:55;

  border:0;
  border-radius:999px;
  background:rgba(255,255,255,0);
  color:transparent;
  cursor:pointer;
  overflow:hidden;

  box-shadow:0 0 0 0 rgba(255,220,145,0);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}

.open-hotspot::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(255,220,145,0);
  transition:box-shadow .18s ease;
}

.open-hotspot:hover,
.open-hotspot:focus-visible{
  transform:scale(1.018);
  background:rgba(255,242,207,.035);
  box-shadow:0 0 0 7px rgba(185,138,62,.08);
}

.open-hotspot:hover::after,
.open-hotspot:focus-visible::after{
  box-shadow:inset 0 0 0 1px rgba(255,224,161,.34);
}

.open-hotspot:active{
  transform:scale(.985);
}

.open-hotspot:focus-visible{
  outline:2px solid rgba(185,138,62,.82);
  outline-offset:4px;
}

.open-hotspot::before{
  content:"";
  position:absolute;
  top:-35%;
  left:-30%;
  width:18%;
  height:170%;
  transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,245,212,.18),transparent);
  animation:buttonShine 3.1s ease-in-out infinite;
}

@keyframes buttonShine{
  0%,60%{left:-30%}
  100%{left:120%}
}

/* =========================================================
   LAPTOP / DESKTOP LANDSCAPE

   Portrait phones keep the opening artwork edge-to-edge.
   On wide screens, trying to COVER a vertical 2:3 poster would
   crop most of the top and bottom, including the Open button.
   Therefore the whole poster is shown, while a blurred copy
   fills the side area.
   ========================================================= */
@media (min-width:768px) and (orientation:landscape){
  .opening-screen{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e7bf78;
  }

  .opening-backdrop{
    display:block;
  }

  .opening-screen::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:rgba(246,225,187,.10);
  }

  .opening-poster{
    position:relative;
    inset:auto;
    z-index:2;
    width:min(100vw, calc(100dvh * 2 / 3));
    height:auto;
    aspect-ratio:2 / 3;
    max-height:100dvh;
  }

  .opening-image{
    object-fit:contain;
    object-position:center center;
  }
}

@media (max-width:640px){
  .map-cta{
    right:3.2%;
    bottom:2.8%;
    min-height:46px;
    padding:6px 13px 6px 6px;
    gap:8px;
  }

  .map-pin{
    width:32px;
    height:32px;
    flex-basis:32px;
  }

  .map-pin svg{
    width:17px;
    height:17px;
  }

  .map-title{
    font-size:11px;
  }

  .map-sub{
    font-size:7px;
    margin-top:4px;
  }

  .music-button{
    width:41px;
    height:41px;
  }

  .music-button svg{
    width:20px;
    height:20px;
  }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
}
</style>
</head>

<body>
<div class="app" id="app">

  <!-- ORIGINAL INVITATION -->
  <section class="invitation-screen" aria-label="Sadanala Family Gruhapravesham invitation">
    <img
      class="invitation-backdrop"
      src="invitation.jpeg"
      alt=""
      aria-hidden="true"
      draggable="false"
    >

    <div class="invitation-poster">

      <!-- Your existing invitation image -->
      <img
        class="invitation-image"
        src="invitation.jpeg"
        alt="Sadanala Family Gruhapravesham Invitation"
        draggable="false"
      >

      <!-- LOCATION -->
      <a
        class="map-cta"
        href="https://www.google.com/maps/search/Jayapradam%20Apartment/@17.48279199,78.37930255,17z?hl=en"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View venue location on Google Maps"
      >
        <span class="map-pin" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 22s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"
              fill="currentColor"
            />
            <circle cx="12" cy="10" r="2.7" fill="#fff5df"/>
          </svg>
        </span>

        <span class="map-copy">
          <span class="map-title">View Location</span>
          <span class="map-sub">Google Maps ↗</span>
        </span>
      </a>

      <!-- MUSIC -->
      <button
        class="music-button"
        id="musicButton"
        type="button"
        aria-label="Pause background music"
        aria-pressed="true"
        title="Background music"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M9 18V6.8L19 5v10.1"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <ellipse cx="6.3" cy="18.2" rx="3.3" ry="2.5" fill="currentColor"/>
          <ellipse cx="16.3" cy="15.4" rx="3.3" ry="2.5" fill="currentColor"/>
          <path
            d="M9 9.4 19 7.6"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
          />
          <path
            class="music-slash"
            d="M4 4 20 20"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          />
        </svg>
      </button>

    </div>
  </section>

  <!-- OPENING IMAGE -->
  <section
    class="opening-screen"
    id="openingScreen"
    aria-label="Housewarming welcome screen"
  >
    <img class="opening-backdrop" src="opening.png" alt="" aria-hidden="true">

    <div class="opening-poster" id="openingPoster">

      <img
        class="opening-image"
        id="openingImage"
        src="opening.png"
        alt="Housewarming celebration - tap Open Invitation to continue"
        draggable="false"
      >

      <button
        class="open-hotspot"
        id="openButton"
        type="button"
        aria-label="Open invitation"
      >
        Open Invitation
      </button>

    </div>
  </section>

  <!-- MUSIC FILE -->
  <audio id="bgMusic" preload="auto" loop playsinline>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

</div>

<script>
(() => {
  const app = document.getElementById('app');
  const openingScreen = document.getElementById('openingScreen');
  const openingImage = document.getElementById('openingImage');
  const openingPoster = document.getElementById('openingPoster');
  const openButton = document.getElementById('openButton');
  const audio = document.getElementById('bgMusic');
  const musicButton = document.getElementById('musicButton');

  let opened = false;
  audio.volume = 0.55;

  /*
    Printed OPEN INVITATION button coordinates inside opening.png.
    These are percentages of the ORIGINAL source artwork.
  */
  const HOTSPOT = {
    left: 0.214,
    top: 0.773,
    width: 0.574,
    height: 0.077
  };

  /*
    Keep the invisible hotspot aligned with the printed button
    when object-fit: cover crops the source image.
  */
  function positionOpeningHotspot(){
    if(!openingImage.naturalWidth || !openingImage.naturalHeight) return;

    const containerWidth = openingPoster.clientWidth;
    const containerHeight = openingPoster.clientHeight;

    const imageWidth = openingImage.naturalWidth;
    const imageHeight = openingImage.naturalHeight;

    const fit = getComputedStyle(openingImage).objectFit;

    const scale = fit === 'contain'
      ? Math.min(containerWidth / imageWidth, containerHeight / imageHeight)
      : Math.max(containerWidth / imageWidth, containerHeight / imageHeight);

    const renderedWidth = imageWidth * scale;
    const renderedHeight = imageHeight * scale;

    /* Centered object-position. Negative offsets mean COVER cropping;
       positive offsets mean CONTAIN letterboxing. */
    const offsetX = (containerWidth - renderedWidth) / 2;
    const offsetY = (containerHeight - renderedHeight) / 2;

    const left = offsetX + imageWidth * HOTSPOT.left * scale;
    const top = offsetY + imageHeight * HOTSPOT.top * scale;
    const width = imageWidth * HOTSPOT.width * scale;
    const height = imageHeight * HOTSPOT.height * scale;

    openButton.style.left = `${left}px`;
    openButton.style.top = `${top}px`;
    openButton.style.width = `${width}px`;
    openButton.style.height = `${height}px`;
  }

  function syncMusicUI(){
    const playing = !audio.paused && !audio.ended;

    musicButton.setAttribute(
      'aria-pressed',
      playing ? 'true' : 'false'
    );

    musicButton.setAttribute(
      'aria-label',
      playing
        ? 'Pause background music'
        : 'Play background music'
    );
  }

  async function openInvitation(){
    if(opened) return;
    opened = true;

    /*
      This click is a real user gesture,
      so browsers normally allow audio here.
    */
    try{
      await audio.play();
    }catch(err){
      /* Music button is still available after opening. */
    }

    syncMusicUI();

    app.classList.add('opened');

    requestAnimationFrame(() => {
      openingScreen.classList.add('hide');
    });
  }

  async function toggleMusic(event){
    event.preventDefault();
    event.stopPropagation();

    if(!audio.paused){
      audio.pause();
      syncMusicUI();
      return;
    }

    try{
      await audio.play();
    }catch(err){}

    syncMusicUI();
  }

  openButton.addEventListener('click', openInvitation);
  musicButton.addEventListener('click', toggleMusic);

  audio.addEventListener('play', syncMusicUI);
  audio.addEventListener('pause', syncMusicUI);

  openingImage.addEventListener('load', positionOpeningHotspot);
  window.addEventListener('resize', positionOpeningHotspot);
  window.addEventListener('orientationchange', positionOpeningHotspot);

  if(openingImage.complete){
    positionOpeningHotspot();
  }

  syncMusicUI();
})();
</script>
</body>
</html>
